<svg width="1000" height="240" viewBox="0 0 1000 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1416"/>
      <stop offset="100%" stop-color="#111A1D"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0 L0 0 0 38" fill="none" stroke="#1B2427" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C97D3D" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C97D3D" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#C97D3D" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="240" fill="url(#bg)"/>
  <rect width="1000" height="240" fill="url(#grid)" opacity="0.5"/>

  <!-- scan-line sweep -->
  <rect x="0" y="0" width="1000" height="10" fill="url(#scanGrad)">
    <animate attributeName="y" values="-10;240;-10" dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <!-- corner HUD brackets -->
  <g stroke="#C97D3D" stroke-width="1.6" fill="none" opacity="0.75">
    <path d="M22,22 L22,48 M22,22 L48,22"/>
    <path d="M978,22 L978,48 M978,22 L952,22"/>
    <path d="M22,218 L22,192 M22,218 L48,218"/>
    <path d="M978,218 L978,192 M978,218 L952,218"/>
  </g>

  <text x="500" y="108" text-anchor="middle" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="42" font-weight="700" fill="#EDEAE2" filter="url(#glow)">
    MEHRAB <tspan fill="#E3A768">SHAHEEN</tspan>
  </text>

  <text x="500" y="142" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace" font-size="14" fill="#4FA6A0" letter-spacing="1.5">
    SECURITY OPERATIONS · AI-ASSISTED SECURITY · INCIDENT RESPONSE
  </text>

  <text x="500" y="182" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" fill="#8FA0A0">
    <tspan>status: </tspan><tspan fill="#C97D3D">engineering intelligent security operations</tspan><tspan fill="#C97D3D">_</tspan>
    <animate attributeName="opacity" values="1;0.25;1" dur="1.3s" repeatCount="indefinite"/>
  </text>
</svg>
