<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient: deep navy -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060B12"/>
      <stop offset="100%" stop-color="#0D1B2A"/>
    </linearGradient>

    <!-- Neon cyan glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Scanline gradient (fades at edges) -->
    <linearGradient id="scanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </linearGradient>

    <!-- Subtle grid pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#123047" stroke-width="0.6"/>
    </pattern>
  </defs>

  <!-- Base background -->
  <rect width="900" height="220" fill="url(#bg)"/>
  <rect width="900" height="220" fill="url(#grid)" opacity="0.5"/>

  <!-- Moving scanline (radar sweep, top to bottom, loops) -->
  <rect x="0" y="0" width="900" height="14" fill="url(#scanGrad)">
    <animate attributeName="y" values="-20;220;-20" dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Corner bracket accents (HUD style) -->
  <g stroke="#00F0FF" stroke-width="2" fill="none" opacity="0.8">
    <path d="M20,20 L20,50 M20,20 L50,20"/>
    <path d="M880,20 L880,50 M880,20 L850,20"/>
    <path d="M20,200 L20,170 M20,200 L50,200"/>
    <path d="M880,200 L880,170 M880,200 L850,200"/>
  </g>

  <!-- Main glowing name text -->
  <text x="450" y="105" text-anchor="middle" font-family="Consolas, 'Courier New', monospace"
        font-size="46" font-weight="700" fill="#E8FBFF" filter="url(#glow)">
    MEHRAB SHAHEEN
    <animate attributeName="opacity" values="0.75;1;0.75" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- Subtitle -->
  <text x="450" y="140" text-anchor="middle" font-family="Consolas, 'Courier New', monospace"
        font-size="17" fill="#5FD4E8" letter-spacing="1.5">
    BLUE TEAM SECURITY · SOC ANALYST · MALWARE ANALYSIS · DFIR
  </text>

  <!-- Bottom status line, blinking cursor style -->
  <text x="450" y="180" text-anchor="middle" font-family="Consolas, 'Courier New', monospace"
        font-size="14" fill="#3A6E82">
    <tspan>status: </tspan><tspan fill="#00F0FF">available for SOC analyst roles</tspan><tspan fill="#00F0FF">_</tspan>
    <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
  </text>
</svg>
