<svg width="1000" height="120" viewBox="0 0 1000 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgF" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111A1D"/><stop offset="100%" stop-color="#0D1416"/>
    </linearGradient>
    <filter id="gF" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="gridF" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0 L0 0 0 34" fill="none" stroke="#1B2427" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1000" height="120" fill="url(#bgF)"/>
  <rect width="1000" height="120" fill="url(#gridF)" opacity="0.4"/>
  <g stroke="#C97D3D" stroke-width="1.6" fill="none" opacity="0.7">
    <path d="M20,16 L20,38 M20,16 L42,16"/>
    <path d="M980,16 L980,38 M980,16 L958,16"/>
    <path d="M20,104 L20,82 M20,104 L42,104"/>
    <path d="M980,104 L980,82 M980,104 L958,104"/>
  </g>
  <text x="500" y="60" text-anchor="middle" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="17" fill="#E3A768" filter="url(#gF)" letter-spacing="1">
    Thanks for stopping by
  </text>
  <text x="500" y="86" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" fill="#4FA6A0">
    <tspan>connection status: </tspan><tspan fill="#C97D3D">open</tspan><tspan fill="#C97D3D">_</tspan>
    <animate attributeName="opacity" values="1;0.25;1" dur="1.3s" repeatCount="indefinite"/>
  </text>
</svg>
