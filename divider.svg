<svg width="1000" height="34" viewBox="0 0 1000 34" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C97D3D" stop-opacity="0"/>
      <stop offset="15%" stop-color="#C97D3D" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#4FA6A0" stop-opacity="0.4"/>
      <stop offset="85%" stop-color="#C97D3D" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#C97D3D" stop-opacity="0"/>
    </linearGradient>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <line x1="0" y1="17" x2="1000" y2="17" stroke="url(#lineGrad)" stroke-width="1.4"/>
  <circle cx="500" cy="17" r="4" fill="#C97D3D" filter="url(#g)">
