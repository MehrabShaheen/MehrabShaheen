    </filter>
  </defs>
  <line x1="0" y1="17" x2="900" y2="17" stroke="url(#lineGrad)" stroke-width="1.5"/>
  <circle cx="450" cy="17" r="4" fill="#00F0FF" filter="url(#softGlow)">
