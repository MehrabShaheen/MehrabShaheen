<svg width="1000" height="190" viewBox="0 0 1000 190" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bgT" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0D1416"/><stop offset="100%" stop-color="#111A1D"/></linearGradient>
  <filter id="gT" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1000" height="190" rx="12" fill="url(#bgT)"/>
<text x="500.0" y="28" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" fill="#4FA6A0" letter-spacing="1">CAREER TIMELINE</text>
<line x1="100" y1="110" x2="900" y2="110" stroke="#233033" stroke-width="2"/>
<line x1="100" y1="110" x2="900" y2="110" stroke="#C97D3D" stroke-width="2" stroke-dasharray="800" stroke-dashoffset="800"><animate attributeName="stroke-dashoffset" values="800;0" dur="2s" fill="freeze"/></line>
<circle cx="280" cy="110" r="8" fill="#1B140C" stroke="#E3A768" stroke-width="2" filter="url(#gT)">
<animate attributeName="r" values="8;11;8" dur="2.4s" repeatCount="indefinite"/></circle>
<text x="280" y="80" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11.5" fill="#E3A768">Apr – Jul 2025</text>
<text x="280" y="142" text-anchor="middle" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#EDEAE2">Cybersecurity Intern</text>
<text x="280" y="162" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="#4FA6A0">Bits Phile</text>
<circle cx="720" cy="110" r="8" fill="#1B140C" stroke="#E3A768" stroke-width="2" filter="url(#gT)">
<animate attributeName="r" values="8;11;8" dur="2.4s" repeatCount="indefinite"/></circle>
<text x="720" y="80" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11.5" fill="#E3A768">Jul – Oct 2025</text>
<text x="720" y="142" text-anchor="middle" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#EDEAE2">SOC Analyst Intern</text>
<text x="720" y="162" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="#4FA6A0">CyberFix</text>
<circle cx="900" cy="110" r="9" fill="#C97D3D">
<animate attributeName="r" values="9;13;9" dur="1.8s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="1;0.5;1" dur="1.8s" repeatCount="indefinite"/></circle>
<text x="900" y="80" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11.5" fill="#C97D3D">NOW</text>
<text x="900" y="142" text-anchor="middle" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#EDEAE2">Open to</text>
<text x="900" y="162" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="#4FA6A0">SOC / Blue Team roles</text>
</svg>