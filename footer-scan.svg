<svg width="900" height="110" viewBox="0 0 900 110" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgF" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1B2A"/>
      <stop offset="100%" stop-color="#060B12"/>
    </linearGradient>
    <filter id="glowF" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="gridF" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#123047" stroke-width="0.6"/>
    </pattern>
  </defs>
  <rect width="900" height="110" fill="url(#bgF)"/>
  <rect width="900" height="110" fill="url(#gridF)" opacity="0.4"/>
  <g stroke="#00F0FF" stroke-width="2" fill="none" opacity="0.7">
    <path d="M20,15 L20,35 M20,15 L40,15"/>
    <path d="M880,15 L880,35 M880,15 L860,15"/>
    <path d="M20,95 L20,75 M20,95 L40,95"/>
    <path d="M880,95 L880,75 M880,95 L860,95"/>
  </g>
  <text x="450" y="58" text-anchor="middle" font-family="Consolas, 'Courier New', monospace"
        font-size="18" fill="#5FD4E8" filter="url(#glowF)" letter-spacing="1">
    thank you for reviewing my profile
  </text>
  <text x="450" y="82" text-anchor="middle" font-family="Consolas, 'Courier New', monospace"
        font-size="13" fill="#3A6E82">
    <tspan fill="#00F0FF">connection request: </tspan><tspan fill="#00F0FF">open</tspan><tspan fill="#00F0FF">_</tspan>
    <animate attributeName="opacity" values="1;0.2;1" dur="1.3s" repeatCount="indefinite"/>
  </text>
</svg>
